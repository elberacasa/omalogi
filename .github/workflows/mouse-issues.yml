name: Mouse issues

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    if: >-
      contains(github.event.issue.labels.*.name, 'verify-a-mouse') &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Labels, assigns and comments on the mouse's issue.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issues = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/mouse-issues.js`)
            await (context.eventName === "issues" ? issues.run : issues.claim)({ github, context })
