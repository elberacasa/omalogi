name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # An older glibc than any Omarchy install, so the binary runs everywhere.
    runs-on: ubuntu-22.04
    permissions:
      # Creates the release and uploads the archive.
      contents: write
      # Build provenance for the archive: a signed statement that this workflow built it
      # from the tagged commit.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: The tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          name=omalogi-x86_64-unknown-linux-gnu
          mkdir -p "dist/$name"
          cp target/release/omalogi packaging/udev/70-omalogi.rules \
            LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            /^## / && found { exit }
            found' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "Omalogi $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md.}"
