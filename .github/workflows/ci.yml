name: CI

on:
  # Pull requests from this repository's own branches would otherwise run twice.
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Manifest is valid JSON
        run: jq -e '.schemaVersion == 1 and .entryPoints.overlay' manifest.json

      - name: Model and issue triage tests
        # A glob, not the directory: Node before 23 runs a directory argument as a file.
        run: node --test "plugin/tests/**/*.test.js" ".github/scripts/*.test.js"

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck install.sh uninstall.sh scripts/check-helper-pin.sh

      # The helper install.sh pins must exist and match its recorded SHA-256. On main it
      # must also be this release, so main never installs a helper from another one.
      - name: Helper pin
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            scripts/check-helper-pin.sh --release
          else
            scripts/check-helper-pin.sh
          fi
